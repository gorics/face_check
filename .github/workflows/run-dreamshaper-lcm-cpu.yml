name: Run Practical DreamShaper LCM CPU

on:
  push:
    paths:
      - 'run_dreamshaper_lcm_cpu.py'
      - '.github/workflows/run-dreamshaper-lcm-cpu.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install 'diffusers>=0.36' 'transformers>=4.48' accelerate safetensors huggingface_hub pillow
      - name: Generate 512px practical samples
        env:
          HF_HUB_DISABLE_XET: '0'
        run: python run_dreamshaper_lcm_cpu.py
      - name: Show summary
        if: always()
        run: cat dreamshaper_lcm_cpu_out/summary.json 2>/dev/null || true
      - name: Upload practical diffusion output
        uses: actions/upload-artifact@v4
        with:
          name: dreamshaper-lcm-practical-cpu
          path: dreamshaper_lcm_cpu_out/
          if-no-files-found: error
          retention-days: 7
